<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LearnHub{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    {% block extra_css %}{% endblock %}
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        :root {
            --primary-blue: #4A90E2;
            --secondary-purple: #9B51E0;
            --accent-teal: #2D9CDB;
            --accent-orange: #FF7A45;
            --accent-green: #27AE60;
            --accent-red: #FF5252;
            --accent-yellow: #FFC107;
            --light-blue: #E3F2FD;
            --light-purple: #F3E5F5;
            --text-dark: #1A1A2E;
            --text-light: #6B7280;
            --bg-white: #ffffff;
            --bg-light: #F8FAFC;
            --border-color: #E5E7EB;
            --gradient-blue: linear-gradient(135deg, #4A90E2, #2D9CDB);
            --gradient-purple: linear-gradient(135deg, #9B51E0, #6A0DAD);
            --gradient-orange: linear-gradient(135deg, #FF7A45, #FF9A3D);
            --gradient-green: linear-gradient(135deg, #27AE60, #2ECC71);
            --gradient-red: linear-gradient(135deg, #FF5252, #FF7B7B);
            --gradient-yellow: linear-gradient(135deg, #FFC107, #FFD54F);
            --shadow: 0 10px 30px rgba(74, 144, 226, 0.1);
            --shadow-hover: 0 20px 50px rgba(74, 144, 226, 0.2);
            --shadow-card: 0 15px 40px rgba(0, 0, 0, 0.08);
            --sidebar-width: 280px;
        }
        
        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* Layout Container */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-white);
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.05);
        }

        .sidebar-header {
            padding: 2rem 1.5rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            margin-bottom: 2rem;
        }

        .sidebar-logo-icon {
            font-size: 2rem;
            background: var(--gradient-blue);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-dark);
            font-family: 'Poppins', sans-serif;
        }

        .sidebar-logo-text span {
            color: var(--secondary-purple);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-light);
            border-radius: 15px;
            margin-top: 1rem;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .user-info h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.2rem;
        }

        .user-info p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .sidebar-nav {
            padding: 1.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.2rem;
            margin-bottom: 0.5rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-item:hover {
            background: var(--light-blue);
            color: var(--primary-blue);
            transform: translateX(5px);
        }

        .nav-item.active {
            background: var(--gradient-blue);
            color: white;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }

        .nav-item.active .nav-icon {
            color: white;
        }

        .nav-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .nav-text {
            flex: 1;
        }

        .nav-badge {
            background: var(--accent-orange);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 1.5rem;
            margin-top: auto;
            border-top: 1px solid var(--border-color);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1.2rem;
            background: transparent;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-light);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .logout-btn:hover {
            background: #FFEBEE;
            border-color: #FF5252;
            color: #FF5252;
            transform: translateX(5px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }

        /* Menu Toggle Button */
        .menu-toggle {
            display: none;
            background: var(--gradient-blue);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .sidebar {
                width: 80px;
            }
            
            .sidebar-header {
                padding: 1.5rem 1rem;
            }
            
            .sidebar-logo-text,
            .user-info,
            .nav-text,
            .logout-btn span:last-child {
                display: none;
            }
            
            .user-profile {
                justify-content: center;
                padding: 0.8rem;
            }
            
            .main-content {
                margin-left: 80px;
            }
            
            .nav-item {
                justify-content: center;
                padding: 1rem;
            }
            
            .logout-btn {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .sidebar.active {
                transform: translateX(0);
            }
        }

    </style>
    {% block extra_styles %}{% endblock %}  <!-- Correct : Django dans HTML -->

</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="{% url 'dashboard_student' %}" class="sidebar-logo">
                    <div class="sidebar-logo-icon">🎓</div>
                    <div class="sidebar-logo-text">Learn<span>Hub</span></div>
                </a>
                
                <div class="user-profile">
                    <div class="user-avatar">
                        É
                    </div>
                    <div class="user-info">
                        <h4>Étudiant LearnHub</h4>
                        <p>Étudiant Premium <span class="level-badge">⭐</span></p>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="{% url 'dashboard_student' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard_student' %}active{% endif %}">
                    <i class="nav-icon fas fa-home"></i>
                    <span class="nav-text">Tableau de bord</span>
                </a>
                <a href="{% url 'mes_cours' %}" class="nav-item {% if request.resolver_match.url_name == 'mes_cours' %}active{% endif %}">
                    <i class="nav-icon fas fa-book-open"></i>
                    <span class="nav-text">Mes cours</span>
                    <span class="nav-badge">8</span>
                </a>
                <a href="{% url 'calendrier' %}" class="nav-item {% if request.resolver_match.url_name == 'calendrier' %}active{% endif %}">
                    <i class="nav-icon fas fa-calendar-alt"></i>
                    <span class="nav-text">Calendrier</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="nav-icon fas fa-tasks"></i>
                    <span class="nav-text">Devoirs</span>
                    <span class="nav-badge">5</span>
                </a>
                <a href="{% url 'progression' %}" class="nav-item {% if request.resolver_match.url_name == 'progression' %}active{% endif %}">
                    <i class="nav-icon fas fa-chart-line"></i>
                    <span class="nav-text">Progression</span>
                </a>
                <a href="{% url 'communaute' %}" class="nav-item {% if request.resolver_match.url_name == 'communaute' %}active{% endif %}">
                    <i class="nav-icon fas fa-users"></i>
                    <span class="nav-text">Communauté</span>
                </a>
                <a href="{% url 'certifications' %}" class="nav-item {% if request.resolver_match.url_name == 'certifications' %}active{% endif %}">
                    <i class="nav-icon fas fa-certificate"></i>
                    <span class="nav-text">Certifications</span>
                    <span class="nav-badge">3</span>
                </a>
                <a href="{% url 'parametres' %}" class="nav-item {% if request.resolver_match.url_name == 'parametres' %}active{% endif %}">
                    <i class="nav-icon fas fa-cog"></i>
                    <span class="nav-text">Paramètres</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}
            <!-- Le contenu spécifique à chaque page viendra ici -->
            {% endblock %}
        </main>
    </div>

    {% block extra_js %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile menu toggle
            if (window.innerWidth < 480) {
                const menuToggle = document.createElement('button');
                menuToggle.className = 'menu-toggle';
                menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
                const topBar = document.querySelector('.top-bar');
                if (topBar) {
                    topBar.prepend(menuToggle);
                    
                    menuToggle.addEventListener('click', () => {
                        document.querySelector('.sidebar').classList.toggle('active');
                    });
                }
            }

            // Logout button
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    if (confirm('Retourner à la page de connexion ?')) {
                        window.location.href = "{% url 'login' %}";
                    }
                });
            }

            // Auto-close sidebar on mobile when clicking outside
            document.addEventListener('click', function(event) {
                const sidebar = document.querySelector('.sidebar');
                const menuToggle = document.querySelector('.menu-toggle');
                
                if (window.innerWidth < 480 && 
                    sidebar.classList.contains('active') &&
                    !sidebar.contains(event.target) &&
                    !menuToggle.contains(event.target)) {
                    sidebar.classList.remove('active');
                }
            });
        });

        // Resize handler
        window.addEventListener('resize', function() {
            const sidebar = document.querySelector('.sidebar');
            if (window.innerWidth >= 480) {
                sidebar.classList.remove('active');
            }
        });
    </script>
    {% endblock %}
</body>
</html>
